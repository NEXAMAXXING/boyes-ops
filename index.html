<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>
  // Block Netlify Identity widget auto-injection
  window.netlifyIdentity = { on: function(){}, open: function(){}, close: function(){}, currentUser: function(){ return null; } };
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13233B">
<title>Boye's Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#13233B; --navy-2:#1C3153; --red:#D43E3E; --gold:#E3B23C;
    --bg:#F3F1EC; --card:#FFFFFF; --ink:#1B2432; --ink-2:#5B6472;
    --line:#E3DFD5; --ok:#1E7A46; --ok-bg:#E8F4ED; --warn:#B3541E;
    --r:14px; --shadow:0 1px 2px rgba(19,35,59,.08),0 4px 14px rgba(19,35,59,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);
       font-size:16px;line-height:1.5;min-height:100dvh}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  input,select,textarea{font:inherit}
  .hide{display:none!important}

  /* ---------- LOGIN ---------- */
  .login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
         background:var(--navy);color:#fff;padding:24px;gap:8px}
  .wordmark{font-variation-settings:'wdth' 78,'wght' 900;text-transform:uppercase;letter-spacing:.04em;
            font-size:clamp(32px,7vw,44px);line-height:1}
  .wordmark .accent{color:var(--gold)}
  /* El aro exterior del emblema es del mismo azul que el encabezado, así que
     sobre el azul perdía su forma. El halo blanco sigue el contorno real del
     logotipo (no un círculo, que no le queda) y se lo devuelve. */
  .emblema{display:block;width:auto;flex:none;
           filter:drop-shadow(0 0 1px rgba(255,255,255,.8)) drop-shadow(0 0 2px rgba(255,255,255,.45))}
  .login .emblema{height:104px;margin-bottom:14px}
  .bar .emblema{height:34px}
  @media(max-width:380px){ .bar .emblema{height:29px} }
  .login .sub{color:#B9C4D6;font-size:15px;margin-bottom:22px;letter-spacing:.12em;text-transform:uppercase}
  .pin-dots{display:flex;gap:14px;margin:10px 0 24px;min-height:16px}
  .pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid #8DA0BF;transition:background .15s}
  .pin-dots span.full{background:var(--gold);border-color:var(--gold)}
  .pad{display:grid;grid-template-columns:repeat(3,minmax(76px,88px));gap:12px}
  .pad button{height:72px;border-radius:16px;background:var(--navy-2);color:#fff;font-size:26px;font-weight:600;
              transition:transform .12s,background .12s}
  .pad button:active{transform:scale(.96);background:#27436E}
  .pad .util{font-size:15px;font-weight:500;color:#B9C4D6}
  .pad .go{background:var(--gold);color:var(--navy);font-weight:800}
  .login-err{color:#FFB4B4;min-height:24px;font-size:15px}

  /* ---------- APP SHELL ---------- */
  header.app{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
  .bar{display:flex;align-items:center;gap:12px;max-width:960px;margin:0 auto;padding-bottom:10px}
  .bar .wordmark{font-size:20px}
  .bar .who{margin-left:auto;text-align:right;font-size:13px;line-height:1.3;color:#C6D0E0}
  .bar .who b{display:block;color:#fff;font-size:14px}
  .bar .out{min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:10px;color:#C6D0E0}
  .bar .out:active{background:var(--navy-2)}
  .tabs{display:flex;max-width:960px;margin:0 auto;overflow-x:auto}
  .tabs button{flex:1;min-height:48px;min-width:max-content;padding:0 12px;font-weight:600;font-size:14px;color:#9FB0C9;
               border-bottom:3px solid transparent;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  .tabs button[aria-selected="true"]{color:#fff;border-color:var(--gold)}
  @media(max-width:768px){header.app .tabs{display:none}}
  @media(max-width:768px){main#main{padding-bottom:calc(68px + env(safe-area-inset-bottom))}}
  .tabs-mobile{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;
    background:var(--navy);border-top:1px solid rgba(255,255,255,.12);
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 20px rgba(19,35,59,.4)}
  @media(max-width:768px){.tabs-mobile{display:flex}}
  .tabs-mobile button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;min-height:58px;padding:6px 2px;font-size:9px;font-weight:800;color:rgba(255,255,255,.4);
    text-transform:uppercase;letter-spacing:.03em;border:none;background:transparent;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:color .15s}
  .tabs-mobile button svg{width:22px;height:22px;flex:none}
  .tabs-mobile button[aria-selected="true"]{color:var(--gold)}
  main{max-width:960px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 32px)}

  /* progress rail */
  .rail{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
  .rail .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .rail .date{font-size:14px;color:var(--ink-2);text-transform:capitalize}
  .rail .count{font-variation-settings:'wdth' 80,'wght' 800;font-size:22px}
  .track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
  .fill{height:100%;border-radius:6px;background:var(--gold);transition:width .3s ease-out;width:0}
  .fill.done{background:var(--ok)}

  /* sections + task tiles */
  .sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
  .sec h2{font-variation-settings:'wdth' 78,'wght' 800;text-transform:uppercase;letter-spacing:.08em;
          font-size:14px;color:var(--navy)}
  .sec::after{content:"";flex:1;height:2px;background:var(--line)}
  .task{width:100%;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
        display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;min-height:64px;
        border-left:4px solid transparent;transition:transform .12s}
  .task:active{transform:scale(.99)}
  .task .box{flex:none;width:30px;height:30px;border-radius:9px;border:2.5px solid #B9BFC9;display:grid;place-items:center;background:#fff}
  .task.is-done{background:var(--ok-bg);border-left-color:var(--ok)}
  .task.is-done .box{background:var(--ok);border-color:var(--ok)}
  .task.is-done .t{color:var(--ink-2)}
  .task .t{font-weight:600;font-size:16px}
  .task .d{font-size:14px;color:var(--ink-2);margin-top:2px}
  .task .meta{font-size:13px;color:var(--ok);margin-top:2px;font-weight:500}
  .task.overdue{border-left-color:var(--red)}
  .task .due-chip{margin-left:auto;flex:none;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:#EFEBE0;color:var(--ink-2)}
  .task.overdue .due-chip{background:#FBE4E4;color:var(--red)}
  .empty{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:28px 20px;text-align:center;color:var(--ink-2)}
  .empty b{display:block;color:var(--ink);margin-bottom:4px}

  /* admin ops */
  .loc-grid{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:640px){.loc-grid{grid-template-columns:1fr 1fr}}
  .loc-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:left;width:100%}
  .loc-card h3{font-variation-settings:'wdth' 78,'wght' 800;text-transform:uppercase;letter-spacing:.05em;font-size:16px;color:var(--navy);margin-bottom:6px}
  .loc-card .big{font-variation-settings:'wdth' 80,'wght' 800;font-size:30px}
  .loc-card .lbl{font-size:13px;color:var(--ink-2);margin-bottom:10px}
  .pill{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;margin-top:10px}
  .pill.warn{background:#FBE4E4;color:var(--red)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .switch{display:flex;gap:8px;margin-bottom:16px}
  .switch button{flex:1;min-height:48px;border-radius:12px;background:#E7E3D9;font-weight:700;color:var(--ink-2)}
  .switch button[aria-pressed="true"]{background:var(--navy);color:#fff}
  .subnav{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:4px}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{flex:none;white-space:nowrap}
  .subnav button{flex:1;min-height:44px;border-radius:12px;background:#E7E3D9;font-weight:700;font-size:14px;color:var(--ink-2)}
  .subnav button[aria-pressed="true"]{background:var(--gold);color:var(--navy)}

  /* forms */
  .panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:14px;margin-bottom:16px}
  @media(max-width:420px){.panel{padding:12px;border-radius:12px}}
  .panel label{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--ink)}
  .panel input,.panel select,.panel textarea{
    min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#FBFAF7;font-size:16px;width:100%}
  .panel textarea{min-height:64px;resize:vertical}
  .frm-row{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  @media(max-width:640px){.frm-row{grid-template-columns:1fr}}
  .frm-row-3{display:grid;gap:14px;grid-template-columns:1fr 1fr 1fr}
  @media(max-width:640px){.frm-row-3{grid-template-columns:1fr 1fr}}
  @media(max-width:400px){.frm-row-3{grid-template-columns:1fr}}
  .btn-primary{min-height:52px;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:16px;
               text-transform:uppercase;letter-spacing:.05em;padding:0 18px}
  .btn-primary:active{transform:scale(.98)}
  .btn-quiet{min-height:44px;border-radius:10px;background:#E7E3D9;color:var(--ink);font-weight:600;padding:0 14px}
  .hint{font-size:13px;color:var(--ink-2);font-weight:400}

  /* finance */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  @media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
  @media(max-width:360px){.kpis{grid-template-columns:1fr}}
  .kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
  .kpi .l{font-size:13px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-variation-settings:'wdth' 80,'wght' 800;font-size:22px;font-variant-numeric:tabular-nums}
  .kpi.in .v{color:var(--ok)} .kpi.out-k .v{color:var(--red)}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input[type=month],.toolbar input[type=date]{min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);font-size:16px}
  .txrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);
         padding:12px 14px;margin-bottom:8px;border-left:4px solid var(--ok)}
  .txrow.eg{border-left-color:var(--red)}
  .txrow .c{flex:1;min-width:0}
  .txrow .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
  .txrow .m{font-size:13px;color:var(--ink-2)}
  .txrow .amt{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;color:var(--ok);white-space:nowrap}
  .txrow.eg .amt{color:var(--red)}
  .txrow .del{min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2)}
  .txrow .del:active{background:#F0EDE5}
  .cat-chip{display:inline-block;font-size:12px;font-weight:700;background:#EFEBE0;color:var(--ink-2);border-radius:999px;padding:2px 8px;text-transform:capitalize}
  .datehead{font-size:13px;font-weight:700;color:var(--ink-2);text-transform:capitalize;margin:16px 0 8px}

  table.pay{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  table.pay th{background:var(--navy);color:#fff;font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:10px 8px;text-align:left}
  table.pay td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.pay td input{width:100%;min-width:76px;min-height:44px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:#FBFAF7;font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
  table.pay .nm{font-weight:600;font-size:15px}
  table.pay .ps{font-size:13px;color:var(--ink-2)}
  table.pay .tot{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  table.pay tfoot td{font-weight:800;background:#FBF7EC}
  input.nospin::-webkit-outer-spin-button,input.nospin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input.nospin{-moz-appearance:textfield;appearance:textfield}
  /* placeholder looks like a real zero, not grayed out */
  input.nospin::placeholder{color:var(--ink);opacity:.55}
  input.nospin:focus::placeholder{opacity:.3}
  input.nospin:focus{background:#FFFDF5;outline:2px solid var(--gold)}
  .pay-wrap{overflow-x:auto;margin-bottom:16px}
  .weeknav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .weeknav>button{min-width:48px;min-height:48px;font-size:22px;border-radius:12px;touch-action:manipulation;display:grid;place-items:center}
  .weeknav b{flex:1;text-align:center;font-size:14px}
  .weeknav b{flex:1;text-align:center;font-size:15px}
  .weeknav button{min-width:48px;min-height:48px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:20px;font-weight:700}
  .saved-flag{font-size:13px;font-weight:700;color:var(--ok)}
  .bars{display:grid;gap:8px}
  .bars .b{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;font-size:14px}
  .bars .bar-track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
  .bars .bar-fill{height:100%;background:var(--red);border-radius:6px}
  .bars .amt2{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}

  /* recurring rounds */
  .task.rec{flex-wrap:wrap;cursor:default}
  .task.rec:active{transform:none}
  .slots{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-top:10px}
  .slot-btn{min-width:70px;min-height:46px;border-radius:10px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;
            background:#EFEBE0;color:var(--ink-2);border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .slot-btn.future{opacity:.45}
  .slot-btn.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
  .slot-btn.missed{background:#FBE4E4;color:var(--red);border-color:#F3C2C2}
  .slot-btn.now{background:var(--gold);color:var(--navy);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(227,178,60,.55)}50%{box-shadow:0 0 0 9px rgba(227,178,60,0)}}
  .alarm-banner{position:sticky;top:0;z-index:40;background:var(--red);color:#fff;border-radius:12px;box-shadow:var(--shadow);
                padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;font-weight:700}
  .alarm-banner .go2{margin-left:auto;background:#fff;color:var(--red);border-radius:10px;min-height:44px;padding:0 14px;font-weight:800}
  .arm-note{background:#FFF6E2;border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px;
            display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
  .arm-note button{margin-left:auto;background:var(--navy);color:#fff;border-radius:10px;min-height:44px;padding:0 14px;font-weight:700;white-space:nowrap}
  .bell.on{color:var(--gold)}

  /* checador / payroll engine */
  .mode-tabs{display:flex;gap:8px;margin-bottom:16px}
  .mode-tabs button{flex:1;min-height:46px;border-radius:12px;background:#E7E3D9;font-weight:700;font-size:14px;color:var(--ink-2)}
  .mode-tabs button[aria-pressed="true"]{background:var(--gold);color:var(--navy)}
  .paste-box{width:100%;min-height:180px;border:2px dashed var(--line);border-radius:12px;padding:12px;background:#FBFAF7;
             font-family:ui-monospace,monospace;font-size:13px;resize:vertical}
  .flag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px}
  .flag.auto{background:#FFF3D6;color:var(--warn)}
  .flag.cierre{background:#FBE4E4;color:var(--red)}
  .flag.falta{background:#EFEBE0;color:var(--ink-2)}
  .flag.nuevo{background:#E3ECFB;color:#2B5AA7}
  table.days{width:100%;border-collapse:collapse;font-size:14px}
  table.days th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line)}
  table.days td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.days td input{width:80px;min-height:40px;border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;background:#FBFAF7;
                      font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
  table.days .plus1{min-height:40px;min-width:44px;border-radius:8px;background:#FBE4E4;color:var(--red);font-weight:800;font-size:13px}
  .emp-scroll{max-height:62vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
              border:1.5px solid var(--line);border-radius:16px;background:#ECE8DD;padding:10px;margin-bottom:16px}
  .emp-scroll .emp-card{margin-bottom:10px}
  .emp-scroll::-webkit-scrollbar{width:8px}
  .emp-scroll::-webkit-scrollbar-thumb{background:#C9C2B2;border-radius:4px}
  /* modo compacto dentro del scroll de asistencia */
  .emp-scroll .emp-card{padding:8px 12px;margin-bottom:8px}
  .emp-scroll .emp-card .hd{margin-bottom:2px}
  .emp-scroll .emp-card .hd .nm2{font-size:14px}
  .emp-scroll .emp-card .hd .hrs{font-size:16px}
  .emp-scroll table.days th{padding:2px 6px;font-size:10px}
  .emp-scroll table.days td{padding:3px 6px;font-size:13px;line-height:1.3}
  .emp-scroll table.days td input[type=time]{min-height:32px !important;padding:2px 4px !important;font-size:13px !important;width:86px}
  .emp-scroll .flag{font-size:10px;padding:1px 6px;margin-left:4px}
  .emp-scroll .plus1{min-height:32px;min-width:40px;font-size:12px;padding:0 6px}
  .emp-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
  .emp-card .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .emp-card .hd .nm2{font-weight:700;font-size:16px;flex:1;min-width:160px}
  .emp-card .hd .hrs{font-variation-settings:'wdth' 80,'wght' 800;font-size:18px;font-variant-numeric:tabular-nums}
  /* Las listas largas se desplazan dentro de su propio recuadro: ya no hay que
     bajar toda la pantalla para llegar al final de una tabla de 40 renglones.
     El encabezado se queda fijo arriba mientras se hace scroll. */
  .res-wrap{overflow-x:auto;overflow-y:auto;max-height:72vh;overscroll-behavior:contain;
            margin-bottom:16px;-webkit-overflow-scrolling:touch}
  .res-wrap table.res thead th{position:sticky;top:0;z-index:3}
  .res-wrap table.res tfoot td{position:sticky;bottom:0;z-index:2;background:var(--card)}
  .lista-larga{max-height:60vh;overflow-y:auto;overscroll-behavior:contain;
               -webkit-overflow-scrolling:touch;padding-right:6px;margin-top:10px}
  .lista-larga::-webkit-scrollbar,.res-wrap::-webkit-scrollbar{width:8px;height:8px}
  .lista-larga::-webkit-scrollbar-thumb,.res-wrap::-webkit-scrollbar-thumb{background:#C9C2B2;border-radius:4px}
  @media print{ .res-wrap{max-height:none;overflow:visible} }
  @media(max-width:640px){table.res{font-size:13px}}
  @media(max-width:420px){table.res th,table.res td{padding:8px 6px}}
  table.res{min-width:860px;width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;font-size:14px}
  table.res th{background:var(--navy);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:10px 8px;text-align:right;white-space:nowrap}
  table.res th:first-child{text-align:left}

function juevesOf(d){ const x=new Date(d); x.setDate(x.getDate() - ((x.getDay()-4+7)%7)); x.setHours(12,0,0,0); return x; }
function forceLogout(msg){ localStorage.removeItem('boyes_user_v2'); toast(msg||'Sesión expirada'); setTimeout(()=>location.reload(), 900); }
/* Antes, si la base tardaba o no contestaba, la promesa se quedaba colgada
   para siempre y la pantalla se quedaba en "Cargando…" sin decir nada.
   Ahora hay un límite de espera y el error se ve. */
let catalogError = null;
let finCargando = false;          // ¿hay una carga de catálogo en curso?
let _eqpPedido = false;           // la plantilla ya se pidió al menos una vez
/* Pantalla de espera con salida: antes, si el catálogo se quedaba en null sin
   error (la carga inicial no llegó, la pestaña estuvo dormida, se cambió de
   sucursal a media consulta), la sección se quedaba en "Cargando…" sin ningún
   botón y sin nadie que volviera a pedir los datos. Eso es lo que se veía
   TRABADO. Ahora toda espera trae su propio botón para reintentar. */
function cargandoView(titulo){
  return `<div class="empty"><b>${titulo}…</b>
    <span style="display:block;margin:8px 0;font-size:13px;color:var(--ink-2)">Si tarda más de unos segundos, toca Reintentar.</span>
    <button class="btn-quiet" id="invRetry" style="margin-top:6px">Reintentar</button></div>`;
}
function reintentarInventario(){
  invError=null; catalogError=null; invData=null; catalog=null; invCargando=false;
  render(); refreshFinance(); refreshInvWeek();
}
/* Si el catálogo falta y nadie lo está pidiendo, se pide solo. Este es el
   seguro que rompe el atasco permanente. */
/* El catálogo (518 insumos, 262 platillos) casi no cambia de un día a otro, y
   esperarlo por red era lo que hacía que Inventario tardara en abrir. Se deja
   una copia en el navegador: la sección pinta al instante con esa copia y la
   versión fresca la sustituye en cuanto llega. */
const CAT_LOCAL = 'boyes_catalogo_v2';
function guardaCatalogoLocal(c){
  try{ localStorage.setItem(CAT_LOCAL, JSON.stringify({t: Date.now(), c})); }catch(e){}
}
function catalogoLocal(){
  try{
    const g = JSON.parse(localStorage.getItem(CAT_LOCAL)||'null');
    if(!g || !g.c || !Array.isArray(g.c.ingredients)) return null;
    if(Date.now() - g.t > 7*86400000) return null;   // más de una semana: mejor no
    return g.c;
  }catch(e){ return null; }
}
function aseguraCatalogo(){
  if(catalog===null && !catalogError && !finCargando) refreshFinance();
}
/* Al volver a la app después de un rato (el celular se bloqueó, se cambió de
   pestaña), la conexión con la base suele haberse caído y la consulta que
   estaba en curso ya nunca contesta. En vez de dejarlo colgado, se vuelve a
   pedir lo que falte. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible' || typeof user==='undefined' || !user) return;
  if(catalog===null && !catalogError) refreshFinance();
  if(typeof invData!=='undefined' && invData===null && !invError && typeof refreshInvWeek==='function'){
    const enInv = (user.role==='administradora' && (tab==='invt'||tab==='pedido'))
               || (user.role==='admin' && tab==='fin' && (finSub==='invt'||finSub==='pedido'));
    if(enInv){ invCargando = false; refreshInvWeek(); }
  }
});
async function finRpc(fn, args, msEspera){
  const limite = msEspera || 12000;
  let reloj;
  const vencido = new Promise((_, rechaza)=>{
    reloj = setTimeout(()=>rechaza(new Error(`El servidor no contestó en ${Math.round(limite/1000)} s (${fn})`)), limite);
  });
  let res;
  try{ res = await Promise.race([ sb.rpc(fn, {p_token: user.token, ...args}), vencido ]); }
  finally{ clearTimeout(reloj); }
  const {data, error} = res || {};
  if(error){
    if((error.message||'').includes('No autorizado')) { forceLogout('Sesión expirada, vuelve a entrar'); throw error; }
    throw new Error(error.message || 'Error de conexión');
  }
  return data;
}

async function loadData(){

function forLocation(locId){ return templates.filter(t => t.location_id===null || t.location_id===locId); }
function forRole(list){
  if(user.role==='admin'||user.role==='administradora') return list;
  return list.filter(t => !t.target_role || t.target_role===user.role);
}
function isDoneToday(t, locId){ return completions.find(c => c.template_id===t.id && c.location_id===locId && c.due_date===todayStr()); }
function lastDone(t, locId){
  const rows = completions.filter(c => c.template_id===t.id && c.location_id===locId);
  if(!rows.length) return null;
  return rows.map(r=>r.due_date).sort().at(-1);
}
function dueToday(t, locId){
  const d = new Date();
  if(t.frequency==='daily')   return true;
  if(t.frequency==='weekly')  return d.getDay()===t.day_of_week;
  if(t.frequency==='monthly') return d.getDate()===t.day_of_month;
  if(t.frequency==='interval'){
    const last = lastDone(t, locId);
    if(!last) return true;
    return daysBetween(new Date(last+'T12:00'), d) >= t.interval_days;
  }
  return false;
}
function intervalStatus(t, locId){
  const last = lastDone(t, locId);
  if(!last) return {days:null, overdue:true, label:'Nunca registrado'};
  const since = daysBetween(new Date(last+'T12:00'), new Date());
  const remaining = t.interval_days - since;
  if(remaining < 0)  return {overdue:true,  label:`Vencido hace ${-remaining} d`};
  if(remaining === 0)return {overdue:true,  label:'Vence hoy'};
  return {overdue:false, label:`En ${remaining} d`};
}
const hhmmNow = () => new Date().toTimeString().slice(0,5);
function slotsFor(t){
  const out = [];
  if(!t.every_minutes || !t.window_start || !t.window_end) return out;
  let [h,m] = t.window_start.slice(0,5).split(':').map(Number);
  const end = t.window_end.slice(0,5);
  while(true){
    const s = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    if(s > end) break;
    out.push(s);
    m += t.every_minutes; h += Math.floor(m/60); m = m%60;
    if(h>23) break;
  }
  return out;
}
function slotDone(t, locId, slot){
  return completions.find(c => c.template_id===t.id && c.location_id===locId && c.due_date===todayStr() && c.slot===slot);
}
function recurringFor(locId){ return forRole(forLocation(locId)).filter(t=>t.frequency==='recurring'); }
function currentSlot(t){
  const now = hhmmNow();
  const past = slotsFor(t).filter(s=>s<=now);
  return past.length ? past.at(-1) : null;
}

/* ---------- alarms ---------- */
function unlockAudio(){
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function chime(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  [[880,0],[1174.66,.18],[880,.36],[1318.5,.54]].forEach(([f,t])=>{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.0001, now+t);
    g.gain.exponentialRampToValueAtTime(.5, now+t+.02);
    g.gain.exponentialRampToValueAtTime(.0001, now+t+.55);
    o.start(now+t); o.stop(now+t+.6);
  });
}
function bigAlarm(){ chime(); setTimeout(chime,1400); setTimeout(chime,2800); if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]); }
async function armAlarms(){
  unlockAudio();
  try{ if('Notification' in window && Notification.permission==='default') await Notification.requestPermission(); }catch(e){}
  try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){}
  alarmsOn = true;
  localStorage.setItem('boyes_alarms','1');
  const b = $('#bell'); b.classList.add('on'); b.setAttribute('aria-pressed','true'); b.setAttribute('aria-label','Alarmas activadas');
  chime(); toast('Alarmas activadas para este turno');
  render();
}
function disarmAlarms(){
  alarmsOn = false; localStorage.removeItem('boyes_alarms');
  try{ wakeLock?.release(); }catch(e){} wakeLock=null;
  const b = $('#bell'); b.classList.remove('on'); b.setAttribute('aria-pressed','false'); b.setAttribute('aria-label','Activar alarmas');
  toast('Alarmas desactivadas'); render();
}
document.addEventListener('visibilitychange', async ()=>{
  if(alarmsOn && document.visibilityState==='visible' && 'wakeLock' in navigator){
    try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  }
});
function pendingNow(){
  const locId = user.role==='admin' ? adminLoc : user.location_id;
  if(!locId) return [];
  const out = [];
  for(const t of recurringFor(locId)){
    const s = currentSlot(t);
    if(s && !slotDone(t, locId, s)) out.push({t, slot:s, locId});
  }
  return out;
}
function tickAlarms(){
  if(!user || user.role==='administradora') return;
  const pend = pendingNow();
  if(alarmsOn){
    for(const p of pend){
      const key = p.t.id+'|'+todayStr()+'|'+p.slot;
      const last = alerted[key]||0;
      if(!last || Date.now()-last > 10*60*1000){
        alerted[key] = Date.now();
        bigAlarm();
        try{
          if('Notification' in window && Notification.permission==='granted')
            new Notification("Boye's Ops", {body:`${p.t.title} — ronda de las ${p.slot}`, tag:key});
        }catch(e){}
      }
    }
  }
  /* 'mant' entra a la lista porque ahí vive ahora el checklist del admin:
     sin eso, una palomita puesta en otro dispositivo no se repintaría. */
  if(tab==='hoy'||tab==='resumen'||tab==='mant') render();
}
async function toggleTask(tplId, locId, slot=''){
  const t = templates.find(x=>x.id===tplId);
  const done = slot ? slotDone(t, locId, slot) : isDoneToday(t, locId);
  if(done){
    const {error} = await sb.from('task_completions').delete().eq('id', done.id);
    if(error){ toast('No se pudo desmarcar'); return; }
    completions = completions.filter(c=>c.id!==done.id);
  }else{
    const row = {template_id:tplId, location_id:locId, due_date:todayStr(), completed_by:user.name, slot};
    const {data, error} = await sb.from('task_completions').insert(row).select().single();
    if(error){ toast('No se pudo guardar'); return; }
    if(!completions.find(c=>c.id===data.id)) completions.push(data);
  }
  render();
}

function taskTile(t, locId, {showChip=false}={}){
  const done = isDoneToday(t, locId);
  const st = t.frequency==='interval' ? intervalStatus(t, locId) : null;
  const meta = done ? `Hecho por ${esc(done.completed_by)} · ${new Date(done.completed_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}` : '';
  return `<button class="task ${done?'is-done':''} ${(!done && st?.overdue)?'overdue':''}" data-t="${t.id}" data-l="${locId}" aria-pressed="${!!done}">
    <span class="box" aria-hidden="true">${done?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}</span>
    <span>
      <span class="t">${esc(t.title)}</span>
      ${t.description?`<span class="d">${esc(t.description)}</span>`:''}
      ${meta?`<span class="meta">${meta}</span>`:''}
    </span>
    ${showChip && st ? `<span class="due-chip">${st.label}</span>` : ''}
  </button>`;
}
function recurringCard(t, locId){
  const now = hhmmNow();
  const slots = slotsFor(t);
  const cur = currentSlot(t);
  const next = slots.find(s=>s>now);
  const chips = slots.map(s=>{
    const done = slotDone(t, locId, s);
    let cls='future', dis=' disabled';
    if(done){ cls='done'; dis=''; }
    else if(s===cur){ cls='now'; dis=''; }
    else if(s<=now){ cls='missed'; dis=''; }
    return `<button class="slot-btn ${cls}"${dis} data-t="${t.id}" data-l="${locId}" data-s="${s}"
      aria-label="${esc(t.title)} ronda ${s}${done?' hecha':''}" aria-pressed="${!!done}">
      ${done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>':''}${s}</button>`;
  }).join('');
  const pendCur = cur && !slotDone(t, locId, cur);
  return `<div class="task rec ${pendCur?'overdue':''}">
    <span style="flex:1;min-width:200px">
      <span class="t">${esc(t.title)}</span>
      ${t.description?`<span class="d">${esc(t.description)}</span>`:''}
      <span class="d">Cada ${t.every_minutes>=60 ? (t.every_minutes/60)+' h' : t.every_minutes+' min'}${next?` · próxima ronda ${next}`:' · última ronda del día'}</span>
    </span>
    <div class="slots">${chips}</div>
  </div>`;
}
function checklistView(locId){
  let sports = '';
  if(sportsAgenda.length){
    const today = todayStr();
    sports = `<details class="panel" style="margin-bottom:14px" ${sportsAgenda.some(s=>s.event_date===today)?'open':''}>
      <summary style="font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px">\u{1F4FA} Agenda deportiva (pr\u00f3ximos 7 d\u00edas)</summary>
      ${sportsAgenda.map(s=>{
        const d2 = new Date(s.event_date+'T12:00');
        const lbl = d2.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
        const isToday = s.event_date===today;
        return `<div class="txrow" style="box-shadow:none;border:1px solid var(--line);${isToday?'border-left:4px solid var(--gold);':''}">
          <div class="c"><div class="t">${isToday?'HOY \u00b7 ':''}${esc(s.title)}</div>
          <div class="m">${lbl}${s.league?' \u00b7 '+esc(s.league):''}</div></div></div>`;
      }).join('')}
      <p class="hint" style="margin-top:8px">Para las TVs del turno. Rod puede pedir en el chat que se agreguen m\u00e1s eventos.</p>
    </details>`;
  }

  const all = forRole(forLocation(locId)).filter(t => dueToday(t, locId));
  const recs = recurringFor(locId);
  let recDue=0, recDone=0;
  const now = hhmmNow();
  for(const t of recs){ for(const s of slotsFor(t)){ if(s<=now){ recDue++; if(slotDone(t,locId,s)) recDone++; } } }
  const doneCount = all.filter(t=>isDoneToday(t,locId)).length + recDone;
  const total = all.length + recDue;
  const pct = total ? Math.round(doneCount/total*100) : 0;

  let html = sports;
  const pend = pendingNow().filter(p=>p.locId===locId);
  if(pend.length){
    const p = pend[0];
    html += `<div class="alarm-banner" role="alert">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>${esc(p.t.title)} — ronda de las ${p.slot}${pend.length>1?` (+${pend.length-1} más)`:''}</span>
      <button class="go2" data-t="${p.t.id}" data-l="${locId}" data-s="${p.slot}">Ya está</button>
    </div>`;
  }
  if(!alarmsOn && user.role!=='administradora' && recs.length){
    html += `<div class="arm-note">
      <span>Activa las alarmas para que la tablet suene cuando toque una ronda.</span>
      <button id="armBtn">Activar alarmas</button>
    </div>`;
  }
  html += `<div class="rail">
    <div class="row"><span class="date">${fmtDate()}</span><span class="count">${doneCount} / ${total}</span></div>
    <div class="track"><div class="fill ${pct===100?'done':''}" style="width:${pct}%"></div></div>
  </div>`;
  if(!total){ return html + `<div class="empty"><b>Sin tareas para hoy</b>Todo tranquilo por aquí.</div>`; }

  if(recs.length){
    html += `<div class="sec"><h2>Rondas del día</h2></div>`;
    html += recs.map(t=>recurringCard(t, locId)).join('');
  }
  for(const area of AREA_ORDER){
    const group = all.filter(t=>t.area===area);
    if(!group.length) continue;
    html += `<div class="sec"><h2>${AREAS[area]}</h2></div>`;
    html += group.map(t=>taskTile(t, locId, {showChip:t.frequency==='interval'})).join('');
  }
  return html;
}

async function loadMant(){

      sb.from('equipment').select('*').eq('active', true).order('name'),
      sb.from('tickets').select('*').order('updated_at', {ascending:false}).limit(120)
    ]);
    let upd = {data:[]};
    if((tk.data||[]).length){
      upd = await sb.from('ticket_updates').select('*')
        .in('ticket_id', tk.data.map(t=>t.id)).order('created_at');
    }
    mantData = {equipment: eq.data||[], tickets: tk.data||[], updates: upd.data||[]};
  }catch(e){ mantData = {equipment:[],tickets:[],updates:[]}; }

async function uploadTicketPhoto(file){
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `t_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error} = await sb.storage.from('mant').upload(path, file, {contentType: file.type||'image/jpeg'});
  if(error) throw error;
  return sb.storage.from('mant').getPublicUrl(path).data.publicUrl;
}

/* ------------------------------------------------------------------
   Los vouchers de la terminal, del corte a la planilla.

   Karen revisa los vouchers el lunes —los cortes de la semana están en la
   caja fuerte— y captura día por día, en el corte, cuánto cobró de verdad
   la terminal. Ese número no sale de Soft: sale del aparato que le manda
   el cargo al banco, y es el que después aparece en el estado de cuenta.

   Aquí se trae a la planilla para que el renglón de TARJETA BANCARIA REAL
   no se capture dos veces. Se guarda por semana (week_start + tc_days), y
   la planilla es por mes: hay que pedir también la semana que arranca en
   el mes anterior, porque sus últimos días caen en éste.

   Un cero no es venta de cero: es un día sin capturar. Por eso se omite.

   La tabla de cortes no se lee directo: tiene RLS sin políticas, como todo
   lo de dinero en este proyecto. Va por RPC, igual que el resto.
   ------------------------------------------------------------------ */
let plaVou = {}, plaVouClave = null;

async function vouchersDelMes(locId, ym){
  try{
    const d = await finRpc('cor_vouchers_mes', { p_loc: Number(locId), p_ym: ym }, 8000);
    const out = {};
    for(const [k, v] of Object.entries(d || {})) out[Number(k)] = Number(v);
    return out;
  }catch(e){ return {}; }   /* sin cortes la planilla se ve igual que siempre */
}

function planDays(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
function planDowShort(ym,d){
  const [y,m]=ym.split('-').map(Number);
  return ['D','L','M','M','J','V','S'][new Date(y,m-1,d).getDay()];
}
function planWeeks(ym){
  const days=planDays(ym);
  const weeks=[]; let cur=null;
  for(let d=1;d<=days;d++){
    const dow=planDowShort(ym,d);
    if(dow==='L'||d===1){if(cur)weeks.push(cur);cur={wk:weeks.length+1,days:[]};}
    cur.days.push(d);
  }
  if(cur)weeks.push(cur);
  return weeks;
}
function planN(v){return v===''||v===null||v===undefined?0:Number(v)||0;}

/* Los conceptos que se muestran: los que tienen movimiento en el mes, más los
   que Rod agregó a mano. Una tabla de 29 renglones repetida cinco veces es
   ilegible cuando veinte de esos renglones están vacíos. */
function planGVVisibles(){
  const g = planEdit.gastos_var || {};
  if(planTodos) return PLAN_GV.slice();
  const conMovimiento = PLAN_GV.filter(c => Object.values(g[c]||{}).some(x => planN(x) !== 0));
  const lista = [...new Set([...conMovimiento, ...planExtra])];
  return lista.length ? PLAN_GV.filter(c => lista.includes(c)) : PLAN_GV.slice();
}

/* Al abrir un mes, cae parado en la semana de hoy —no en la semana 1— porque
   la captura casi siempre es de esta semana. En un mes pasado abre en la
   primera, que es por donde se revisa. */
function planSemHoy(weeks){
  const hoy = new Date();
  const ym = hoy.toISOString().slice(0,7);
  if(ym !== planMonth) return 0;
  const d = hoy.getDate();
  const i = weeks.findIndex(w=>w.days.includes(d));
  return i<0 ? 0 : i;
}

    .pt tr.tot td{background:${P_AZUL};color:#06283F;font-weight:900;padding:7px 7px;font-size:12px;
                  text-align:right;border-bottom-color:#3E96CC}
    .pt tr.tot td.cl{background:${P_AZUL};text-align:left;font-weight:900;letter-spacing:.02em}
    .pt tr.tot td.tc{background:${P_NARA};color:#3A2100;box-shadow:inset 1px 0 0 #D2842A}
    .pt .sh td{color:#fff;font-weight:800;font-size:11.5px;padding:0;letter-spacing:.1em;
               text-transform:uppercase;border-bottom:0}
    .pt .sh td b{position:sticky;left:0;display:inline-block;padding:8px 12px;font-weight:800}
    .pt tbody td{background:var(--card)}
    .pt tbody tr:hover td{background-color:#FBFAF6}
    .pt input{border:0;width:100%;min-width:0;min-height:31px;padding:2px 9px;text-align:right;
              font-size:13px;background:transparent;font-family:inherit;font-weight:600;
              font-variant-numeric:tabular-nums lining-nums;display:block;color:var(--ink);
              border-radius:6px}
    .pt input::placeholder{color:#C6C1B4;font-weight:400}
    .pt input:hover{background:#F4F2EC}
    .pt input:focus{background:#FFFBEA;outline:2px solid var(--gold);outline-offset:-2px}
    .pt tr.pt-fila td{background-color:#FFF8E0}
    .pt td.pt-col{background-color:#FFF8E0}
    .pt tr.pt-fila .cl{background-color:#FDF0C4;font-weight:800}
    .pt tbody .cl{background:var(--card)}
    .pt tbody tr.pt-fila .cl{background:#FDF0C4}
    /* La letra de familia. Chica, con color, pegada al concepto: se lee de
       reojo sin robarle espacio al número. */
    .fam{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:4px;
         color:#fff;font-size:10px;font-weight:900;text-align:center;margin-right:7px;
         padding:0 3px;vertical-align:1px;letter-spacing:.02em}
    .pt-cta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
    .pt-cta select{padding:7px 9px;border:1px solid #D8D2C4;border-radius:8px;background:var(--card);
                   font-family:inherit;font-size:12.5px;max-width:230px}
    /* El desglose por familia: la respuesta a "de este mes, cuánto fue comida". */
    .famg{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(174px,1fr));margin-top:4px}
    .famc{border:1px solid #E1DCD0;border-radius:10px;padding:9px 11px;background:var(--card);
          border-left-width:5px}
    .famc .l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#6B6455}
    .famc .v{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:1px}
    .famc .s{font-size:11px;color:#7A7365;font-weight:600}
    @media(max-width:640px){ .pt{min-width:700px} .pt .cl{width:150px;font-size:12px;padding:4px 8px} }

    /* ===== Lo más parecido a su hoja de Excel =====
       Rod lo pidió así: no la marca, la plantilla. Fondo blanco, cuadrícula
       negra delgada, letra Arial, columna TOTAL y renglones de total en el
       azul de la hoja, domingo en rojo lleno en los gastos. */
    #wkSlide.wk{border:1px solid #000;border-radius:0;box-shadow:none;background:#fff}
    /* Más ancha que el resto de la página: rompe el límite de 960px y usa toda
       la pantalla (hasta 1500px), para que quepan al menos dos semanas
       completas a la vista. */
    #wkSlide.wk{position:relative;max-width:none}
    #wkSlide .pt input{padding:2px 3px;font-size:12px}
    #wkSlide .pt .cl{width:auto;font-size:11.5px;padding:4px 7px}
    #wkSlide .pt .tc{padding:5px 6px;min-width:0}
    #wkSlide .pt tr.tot td{padding:6px 5px;font-size:12px}
    #wkSlide .wk-h{background:#fff;color:#000;border-bottom:1px solid #000;letter-spacing:0;font-size:18px}
    #wkSlide .wk-h .sub{color:#555;font-size:12px}
    #wkSlide .wk-h .tot{color:#000}
    #wkSlide .pt{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#000}
    #wkSlide .pt th,#wkSlide .pt td{border-right:1px solid #000 !important;border-bottom:1px solid #000 !important}
    #wkSlide .pt thead th,#wkSlide .pt thead th.fin,#wkSlide .pt thead th.dom{background:#fff !important;color:#000 !important;
       font-weight:700;text-align:left;padding:4px 6px;border-bottom:2px solid #000 !important}
    #wkSlide .pt thead th span{font-weight:700}
    #wkSlide .pt thead .cl{background:#fff !important;color:#000 !important}
    #wkSlide .pt thead th.tc{background:${P_AZUL} !important;color:#000 !important;text-align:right}
    #wkSlide .pt .cl,#wkSlide .pt tbody .cl{background:#fff !important;color:#000;font-weight:700;text-transform:uppercase;
       font-size:12.5px;box-shadow:1px 0 0 #000}
    #wkSlide .pt tbody td,#wkSlide .pt .fin{background:#fff}
    #wkSlide .pt tbody tr:hover td{background-color:#fff}
    #wkSlide .pt .sh td{background:#fff !important;color:#000 !important;border-bottom:2px solid #000 !important}
    #wkSlide .pt .sh td b{padding:7px 10px;font-weight:900;letter-spacing:.04em}
    #wkSlide .pt .tc,#wkSlide .pt tbody td.tc{background:${P_AZUL} !important;color:#000;font-weight:700;box-shadow:none}
    #wkSlide .pt tr.tot td,#wkSlide .pt tr.tot td.cl{background:${P_AZUL} !important;color:#000;font-weight:700}
    #wkSlide .pt tr.tot td.tc{background:${P_NARA} !important;color:#000}
    #wkSlide .pt tbody tr.gas td.dom{background:${P_ROJO} !important}
    #wkSlide .pt tbody tr.gas:hover td.dom{background:${P_ROJO} !important}
    #wkSlide .pt tbody tr.gas td.dom input{color:#000}
    #wkSlide .pt input{color:#000;font-family:Arial,Helvetica,sans-serif;font-weight:400;border-radius:0}
    #wkSlide .pt input:hover{background:transparent}
    #wkSlide .pt input:focus{background:#fff;outline:2px solid #1A73E8;outline-offset:-2px}
    #wkSlide .pt .wini,#wkSlide .pt thead th.wini{box-shadow:inset 2px 0 0 #000}
    #wkSlide .pt tr.pt-fila td,#wkSlide .pt td.pt-col{background-color:#E8F0FE}
    #wkSlide .pt tr.pt-fila .cl{background:#E8F0FE !important}
    #wkSlide .fam{background:transparent !important;color:#000;border:1px solid #000;border-radius:0;font-weight:700}
  </style>`;

  /* ---------- un bloque por semana ---------- */
  const filaVenta = (w, label, key, extraCls) => {
    let wk = 0, cel = '';
    w.days.forEach(d=>{
      wk += planN((v[d]||{})[key]);
      cel += `<td><input type="text" size="1" inputmode="decimal" class="nospin" data-pv="${d}" data-pvf="${key}" value="${(v[d]||{})[key]||''}"></td>`;
    });
    return `<tr class="${extraCls||''}"><td class="cl">${label}</td>${cel}<td class="tc">${wk>0?money0(wk):''}</td></tr>`;
  };

  let h = css;

  /* Barra de acciones: la de formato de siempre, más el interruptor de
     conceptos, que es lo que evita que cada semana traiga 29 renglones en
     blanco. */
  h += fmtBarra();
  const ocultos = PLAN_GV.filter(c=>!cats.includes(c));
  h += `<div class="pt-cta">
    <button class="btn-quiet" data-planall="${planTodos?'0':'1'}">${planTodos?'Ocultar conceptos sin movimiento':`Ver los ${PLAN_GV.length} conceptos`}</button>
    ${ocultos.length?`<select id="planAdd"><option value="">+ Agregar concepto…</option>${
      ocultos.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>`:''}
    <span class="hint" style="margin:0">${cats.length} de ${PLAN_GV.length} conceptos a la vista</span>
  </div>`;

  /* Los totales de todas las semanas se calculan siempre —el resumen del mes
     los necesita— aunque en pantalla solo se dibuje la semana activa. */
  const semTot = weeks.map(w=>{
    let venta = 0, gasto = 0;
    w.days.forEach(d=>{
      venta += planN((v[d]||{}).ef) + planN((v[d]||{}).tj)
             + planN((v[d]||{}).ra) + planN((v[d]||{}).mq);
      gasto += cats.reduce((s,c)=>s+planN((g[c]||{})[d]), 0);
    });
    return {wk:w.wk, venta, gasto, dias:w.days.slice()};
  });

  /* Una semana a la vez, y se pasa de lado. Apiladas hacia abajo obligaban a
     bajar media pantalla para comparar el lunes con el domingo; de lado, la
     semana entera está siempre a la misma altura. */
  if(planSem===null || planSem===undefined) planSem = planSemHoy(weeks);
  planSem = Math.max(0, Math.min(weeks.length-1, planSem));
  const w = weeks[planSem], st = semTot[planSem];
  const dIni = w.days[0], dFin = w.days[w.days.length-1];

  h += `<div class="wknav">
    <button class="wkbtn" data-plansem="${planSem-1}" ${planSem===0?'disabled':''} aria-label="Semana anterior">‹</button>
    <div class="wkchips">${weeks.map((x,i)=>`
      <button class="wkchip${i===planSem?' on':''}" data-plansem="${i}">
        <span class="n">SEM ${x.wk}</span>
        <span class="r">${x.days[0]}–${x.days[x.days.length-1]}</span>
      </button>`).join('')}</div>
    <button class="wkbtn" data-plansem="${planSem+1}" ${planSem===weeks.length-1?'disabled':''} aria-label="Semana siguiente">›</button>
  </div>`;

  /* El mes entero en una sola tabla que se desliza de lado, como la hoja de
     Rod: semana tras semana, cada una cerrada con su TOTAL. Las fichas de
     arriba ya no cambian de tabla: llevan a esa semana dentro de la misma. */
  const COLS = [];
  weeks.forEach((wx, i) => {
    wx.days.forEach((d, j) => COLS.push({t:'d', d, ini: j===0 && i>0}));
    COLS.push({t:'w', i});
  });
  /* Anchos de columna: por defecto caben 3 semanas en una laptop; el usuario
     los puede estirar con el mouse (orilla derecha del encabezado) y se
     guardan en este navegador. Doble clic en la orilla = volver al normal. */
  const ANCHO_CL = AN.cl, ANCHO_D = AN.d, ANCHO_T = AN.t;
  const anchoTabla = ANCHO_CL + COLS.reduce((s,c)=>s+(c.t==='d'?ANCHO_D:ANCHO_T), 0);
  const tdCls = (c, extra) => {
    const k = [];
    if(c.t==='w') k.push('tc');
    if(c.ini) k.push('wini');
    if(extra) k.push(extra);
    return k.length ? ` class="${k.join(' ')}"` : '';
  };
  const ventaDia = d => planN((v[d]||{}).ef)+planN((v[d]||{}).tj)+planN((v[d]||{}).ra)+planN((v[d]||{}).mq);

  h += `<style>
    .pt .wini{box-shadow:inset 3px 0 0 #8FA3C0}
    .pt thead th.wini{box-shadow:inset 3px 0 0 #8FA3C0}
    #wkSlide .wk-sc{scroll-behavior:smooth;scroll-snap-type:x proximity}
    #wkSlide .pt th.snap{scroll-snap-align:start}
    #wkSlide .pt th .rz{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:3}
    #wkSlide .pt th .rz:hover,#wkSlide.rzing .pt th .rz{background:rgba(26,115,232,.35)}
    #wkSlide.rzing,#wkSlide.rzing *{cursor:col-resize !important;user-select:none}
    #wkSlide .wk-h .ver{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:700;margin-left:12px}
    #wkSlide .wk-h .ver button{border:1px solid #000;background:#fff;color:#000;font:700 11.5px Arial,sans-serif;padding:3px 8px;cursor:pointer}
    #wkSlide .wk-h .ver button:hover{background:#E8F0FE}
  </style>`;

  const mesVenta = semTot.reduce((s,x)=>s+x.venta,0);
  h += `<div class="wk" id="wkSlide">
      <div class="wk-h">${nomMes.toUpperCase()}
        <span class="sub">Ctrl/⌘ + rueda para zoom · estira columnas desde los encabezados</span>
        <span class="ver">Ver <button data-ver="1">1 sem</button><button data-ver="2">2 sem</button><button data-ver="3">3 sem</button><button data-ver="mes">Mes</button></span>
        <span class="tot">${mesVenta>0?money(mesVenta):'—'}</span></div>
      <div class="wk-sc" id="wkScroll"><table class="pt" style="width:${anchoTabla}px;min-width:${anchoTabla}px;table-layout:fixed">
        <colgroup><col data-an="cl" style="width:${ANCHO_CL}px">${COLS.map(c=>`<col data-an="${c.t==='d'?'d':'t'}" style="width:${c.t==='d'?ANCHO_D:ANCHO_T}px">`).join('')}</colgroup>
        <thead><tr>
        <th class="cl" style="position:relative">CONCEPTO<i class="rz" data-rz="cl" title="Arrastra para hacer más ancho · doble clic: normal"></i></th>`;
  COLS.forEach(c=>{
    if(c.t==='w'){ h += `<th class="tc" style="position:relative">TOTAL S${weeks[c.i].wk}<i class="rz" data-rz="t" title="Arrastra para cambiar el ancho de los totales"></i></th>`; return; }
    const dow = planDowShort(planMonth, c.d);
    const fin = dow==='S'||dow==='D';
    const wkI = weeks.findIndex(x=>x.days[0]===c.d);
    h += `<th class="${[dow==='D'?'dom':(fin?'fin':''), c.ini?'wini':'', wkI>=0?'snap':''].filter(Boolean).join(' ')}"${wkI>=0?` data-wkstart="${wkI}"`:''} style="padding:5px 4px;font-size:10px;position:relative">${dow}<br>
          <span style="font-size:12.5px;font-weight:800">${c.d}</span><i class="rz" data-rz="d" title="Arrastra para cambiar el ancho de todos los días"></i></th>`;
  });
  h += `</tr></thead><tbody>`;
  const NC = COLS.length + 1;

  const filaVentaMes = (label, key) => {
    let cel = '', mes = 0;
    COLS.forEach(c=>{
      if(c.t==='w'){
        const t = weeks[c.i].days.reduce((s,d)=>s+planN((v[d]||{})[key]),0); mes += t;
        cel += `<td class="tc">${t>0?money0(t):''}</td>`; return;
      }
      cel += `<td${tdCls(c)}><input type="text" size="1" inputmode="decimal" class="nospin" data-pv="${c.d}" data-pvf="${key}" value="${(v[c.d]||{})[key]||''}"></td>`;
    });
    return `<tr><td class="cl">${label}</td>${cel}</tr>`;
  };

  h += `<tr class="sh"><td colspan="${NC}" style="background:#1B2E4D"><b>Ventas</b></td></tr>`;
  h += filaVentaMes('EFECTIVO','ef');
  h += filaVentaMes('TARJETA BANCARIA CORTE','tj');

  /* TARJETA BANCARIA REAL ya no se teclea: llega del corte de la semana. Si
     alguien escribió algo a mano en un día, eso manda. */
  const vouOk = plaVouClave === `${finLoc}|${planMonth}`;
  {
    const realDe = d => {
      const manual = planN((v[d]||{}).tr);
      const corte  = vouOk && plaVou[d] != null ? Number(plaVou[d]) : null;
      return { val: manual > 0 ? manual : corte, manual: manual > 0 };
    };
    let cel = '', celD = '';
    COLS.forEach(c=>{
      if(c.t==='w'){
        let t = 0, dt = 0, n = 0;
        weeks[c.i].days.forEach(d=>{
          const r = realDe(d), cap = planN((v[d]||{}).tj);
          t += r.val || 0;
          if(r.val != null && cap){ dt += r.val - cap; n++; }
        });
        cel  += `<td class="tc">${t>0?money0(t):''}</td>`;
        celD += `<td class="tc" style="color:${Math.abs(dt)<1?'#0B6E3F':'#C0261F'};font-weight:800">${n?(Math.abs(dt)<1?'✓':money0(dt)):''}</td>`;
        return;
      }
      const r = realDe(c.d);
      cel += r.val === null || r.val === undefined
        ? `<td${tdCls(c)}><span style="color:#A8A296;padding:0 9px">—</span></td>`
        : `<td${tdCls(c)}${r.manual?' title="Capturado a mano en la planilla, no viene del corte"':' title="Voucher de la terminal, tomado del corte de esa semana"'}
             style="color:${r.manual?'#B36B00':'#7A3EA1'};font-weight:700;text-align:right;padding-right:9px">${money0(r.val)}</td>`;
      const cap = planN((v[c.d]||{}).tj);
      if(r.val === null || r.val === undefined || !cap){ celD += `<td${tdCls(c)}></td>`; return; }
      const x = Math.round((r.val - cap)*100)/100;
      celD += `<td${tdCls(c)} style="color:${Math.abs(x)<1?'#0B6E3F':'#C0261F'};font-weight:800;text-align:right;padding-right:9px">${Math.abs(x)<1?'✓':money0(x)}</td>`;
    });
    h += `<tr class="tr"><td class="cl">TARJETA BANCARIA REAL <span style="font-weight:500;color:#7A7365">(voucher terminal)</span></td>${cel}</tr>`;
    h += `<tr><td class="cl" style="font-size:11.5px">DIFERENCIA <span style="font-weight:500;color:#7A7365">real − corte</span></td>${celD}</tr>`;
  }

  h += filaVentaMes('RAPPI','ra');
  h += filaVentaMes('MAQUILAS TETAKAWI','mq');

  h += `<tr class="tot"><td class="cl">VENTA TOTAL DIARIA</td>`;
  COLS.forEach(c=>{
    if(c.t==='w'){ const t = semTot[c.i].venta; h += `<td class="tc">${t>0?money0(t):''}</td>`; return; }
    const t = ventaDia(c.d);
    h += `<td${tdCls(c)}>${t>0?money0(t):''}</td>`;
  });
  h += `</tr>`;

  h += `<tr class="sh"><td colspan="${NC}" style="background:#175637"><b>Gastos</b></td></tr>`;
  cats.forEach(cat=>{
    const gc = g[cat] || {};
    let cel = '';
    COLS.forEach(c=>{
      if(c.t==='w'){
        const t = weeks[c.i].days.reduce((s,d)=>s+planN(gc[d]),0);
        cel += `<td class="tc">${t>0?money0(t):''}</td>`; return;
      }
      const dom = planDowShort(planMonth, c.d)==='D' ? 'dom' : '';
      cel += `<td${tdCls(c, dom)}><input type="text" size="1" inputmode="decimal" class="nospin" data-pg="${esc(cat)}" data-pgd="${c.d}" value="${gc[c.d]||''}"></td>`;
    });
    h += `<tr class="gas"><td class="cl">${famChip(planFamDe(cat))}${esc(cat)}</td>${cel}</tr>`;
  });

  h += `<tr class="tot"><td class="cl">TOTAL DE GASTOS</td>`;
  COLS.forEach(c=>{
    if(c.t==='w'){ const t = semTot[c.i].gasto; h += `<td class="tc">${t>0?money0(t):''}</td>`; return; }
    const t = cats.reduce((s,k)=>s+planN((g[k]||{})[c.d]), 0);
    h += `<td${tdCls(c)}>${t>0?money0(t):''}</td>`;
  });
  h += `</tr>`;
  h += `</tbody></table></div></div>`;

  if(typeof pvPanel === 'function') h += pvPanel(w);

  /* ---------- resumen del mes ---------- */
  const vtMes = semTot.reduce((s,x)=>s+x.venta, 0);
  const gvMes = PLAN_GV.reduce((s,c)=>s+Object.values(g[c]||{}).reduce((a,b)=>a+planN(b),0), 0);
  const totalFijos = Object.values(planEdit.gastos_fijos||{}).reduce((s,r)=>s+planN(r.monto), 0);
  const util = vtMes - gvMes - totalFijos;

  // por familia
  const porFam = {};
  PLAN_GV.forEach(c=>{
    const mes = Object.values(g[c]||{}).reduce((a,b)=>a+planN(b), 0);
    if(!mes) return;
    const f = planFamDe(c);
    porFam[f] = (porFam[f]||0) + mes;
  });
  const famOrden = Object.entries(porFam).sort((a,b)=>b[1]-a[1]);

  h += `<div class="panel"><div class="d-h3">Cómo se repartió el gasto del mes</div>
    <p class="hint" style="margin:0 0 10px">Cada concepto lleva su letra —A alimentos, B bebidas, C cerveza— y aquí
    se suman por familia. El porcentaje es sobre la venta del mes, que es como se mide de verdad: no importa que
    alimentos hayan sido $180,000, importa que hayan sido el 30% de lo que vendiste.</p>`;

  if(!famOrden.length){
    h += `<p class="hint">Todavía no hay gastos capturados en ${nomMes}.</p>`;
  } else {
    h += `<div class="famg">${famOrden.map(([f,m])=>{
      const d = PLAN_FAM[f] || PLAN_FAM.O;
      return `<div class="famc" style="border-left-color:${d.c}">
        <div class="l">${famChip(f)}${esc(d.n)}</div>
        <div class="v">${money(m)}</div>
        <div class="s">${vtMes?((m/vtMes)*100).toFixed(1)+'% de la venta':(gvMes?((m/gvMes)*100).toFixed(1)+'% del gasto':'')}</div>
      </div>`;
    }).join('')}</div>`;
  }

  /* Detalle por concepto: aquí vive el total del mes de cada renglón, que era
     lo único que se perdía al partir la tabla por semanas. Y aquí se corrige
     la letra, porque es donde se ve el efecto de corregirla. */
  h += `<div class="d-h4" style="margin-top:18px">Concepto por concepto</div>
    <div class="res-wrap"><table class="res" style="font-size:12.5px"><thead><tr>
      <th style="text-align:left;min-width:190px">Concepto</th>
      <th style="min-width:120px">Familia</th>
      ${semTot.map(s=>`<th style="min-width:84px">SEM ${s.wk}</th>`).join('')}
      <th style="min-width:98px">TOTAL MES</th>
      <th style="min-width:64px">% vta</th>
    </tr></thead><tbody>`;
  PLAN_GV.forEach(cat=>{
    const gc = g[cat] || {};
    const mes = Object.values(gc).reduce((a,b)=>a+planN(b), 0);
    if(!mes && !planTodos) return;
    const f = planFamDe(cat);
    h += `<tr><td style="text-align:left">${esc(cat)}</td>
      <td><select data-planfam="${esc(cat)}" style="font-size:11.5px;padding:3px 5px;border:1px solid #DDD8CC;border-radius:6px;background:var(--card);font-family:inherit">

/* Un solo escucha para toda la tabla, puesto una vez. Da tres cosas que es lo
   que uno espera de una hoja de cálculo y aquí no había: saber dónde estás
   parado, moverte con las flechas, y que al entrar a una casilla se seleccione
   lo que ya tenía para escribir encima. */
let _ptListo = false;
/* Pasar de semana con el dedo. El detalle que lo hace usable: la tabla de
   adentro también se desplaza de lado en el celular, así que el gesto solo
   cambia de semana cuando esa tabla YA llegó a su orilla. Si no, se estaría
   peleando con el desplazamiento de las columnas. */
let _deslizListo = false;
function instalaDeslizarSemana(){
  if(_deslizListo) return;
  _deslizListo = true;
  const M = document.getElementById('main');
  let x0=null, y0=null, sc=null, izq0=0, max0=0;

  M.addEventListener('touchstart', e=>{
    const blk = e.target.closest('#wkSlide');
    if(!blk || e.touches.length!==1){ x0=null; return; }
    sc = blk.querySelector('.wk-sc');
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    izq0 = sc ? sc.scrollLeft : 0;
    max0 = sc ? sc.scrollWidth - sc.clientWidth : 0;
  }, {passive:true});

  M.addEventListener('touchend', e=>{
    if(x0===null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy)*1.4) return;
    /* Solo desde la orilla: si la tabla todavía tiene columnas que mostrar de
       ese lado, el gesto le pertenece a ella. */
    /* Ya no hace falta: el mes entero vive en una sola tabla que se desliza. */
    return;
  }, {passive:true});

  /* Con teclado: las flechas dentro de una casilla mueven el cursor, así que
     el cambio de semana va con Alt. */
  M.addEventListener('keydown', e=>{
    if(!e.altKey) return;
    if(e.key==='ArrowRight'){ planSem++; planIrA=planSem; render(); }
    else if(e.key==='ArrowLeft'){ planSem=Math.max(0,planSem-1); planIrA=planSem; render(); }
  });
}

function instalaCuadricula(){
  if(_ptListo) return;
  _ptListo = true;
  const M = document.getElementById('main');

  const cruz = inp => {
    M.querySelectorAll('.pt tr.pt-fila').forEach(t=>t.classList.remove('pt-fila'));
    M.querySelectorAll('.pt td.pt-col').forEach(t=>t.classList.remove('pt-col'));
    if(!inp) return;
    const td = inp.closest('td'), tr = inp.closest('tr');
    if(!td || !tr) return;
    tr.classList.add('pt-fila');
    const i = td.cellIndex;
    tr.closest('table').querySelectorAll('tbody tr').forEach(f=>{
      const c = f.cells[i]; if(c) c.classList.add('pt-col');
    });
  };

  M.addEventListener('focusin', e=>{
    if(!e.target.matches('.pt input')) return;
    cruz(e.target);
    /* Seleccionar el contenido al entrar: así se escribe encima en vez de
       tener que borrar primero, que es como se captura de verdad. */
    if(e.target.type!=='checkbox') setTimeout(()=>{ try{ e.target.select(); }catch(_){} }, 0);
  });
  M.addEventListener('focusout', e=>{ if(e.target.matches('.pt input')) setTimeout(()=>{
    if(!M.querySelector('.pt input:focus')) cruz(null); }, 0); });

  M.addEventListener('keydown', e=>{
    const inp = e.target;
    if(!inp.matches('.pt input')) return;
    const td = inp.closest('td'), tr = inp.closest('tr');
    if(!td || !tr) return;
    const col = td.cellIndex, filas = [...tr.closest('tbody').rows];
    const iF = filas.indexOf(tr);
    const salta = (df, dc) => {
      for(let k=1; k<=40; k++){
        const f = filas[iF + df*k];
        if(df && !f) return null;
        const fila = df ? f : tr;
        const c = fila.cells[col + (df?0:dc*k)];
        const x = c && c.querySelector('input');
        if(x) return x;
        if(!df && !c) return null;
      }
      return null;
    };
    let destino = null;
    if(e.key==='ArrowDown' || e.key==='Enter') destino = salta(1,0);
    else if(e.key==='ArrowUp') destino = salta(-1,0);
    else if(e.key==='ArrowRight' && inp.selectionStart===inp.value.length) destino = salta(0,1);
    else if(e.key==='ArrowLeft' && inp.selectionStart===0) destino = salta(0,-1);
    else return;
    if(destino){ e.preventDefault(); destino.focus(); }
  });
}

      else sc.scrollLeft = inicioDe(planSem || 0);

          const up = () => { box.classList.remove('rzing'); sc.style.scrollSnapType = ''; anGuarda(AN);
            window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };

      const ths = [...sc.querySelectorAll('th[data-wkstart]')];
      sc.addEventListener('scroll', ()=>{

async function exportPlanExcel(){
  await loadXLSX();
  if(typeof XLSX==='undefined'){toast('Error cargando librería Excel');return;}
  const [y,m]=planMonth.split('-').map(Number);
  const weeks=planWeeks(planMonth);
  const v=planEdit.ventas||{},g=planEdit.gastos_var||{},f=planEdit.gastos_fijos||{},b=planEdit.banco||{};
  const mn=new Date(y,m-1,1).toLocaleString('es-MX',{month:'long'}).toUpperCase()+' SC '+y;
  const rows=[[mn],[],['CONCEPTO',...weeks.flatMap(w=>[...w.days.map(d=>planDowShort(planMonth,d)+d),`TOT S${w.wk}`]),'TOTAL MES']];
  const addR=(lbl,key,src)=>{
    let mes=0;const row=[lbl];
    weeks.forEach(w=>{let wk=0;w.days.forEach(d=>{const val=planN((src[d]||{})[key]);row.push(val||null);wk+=val;mes+=val;});row.push(wk||null);});
    row.push(mes||null);rows.push(row);return mes;
  };
  addR('EFECTIVO','ef',v);addR('TARJETA BANCARIA CORTE','tj',v);
  /* La tarjeta real sale del voucher de la terminal que se capturó en el
     corte; si alguien escribió algo a mano en la planilla, eso manda. Abajo,
     el renglón que se pidió: cuánto cobró la terminal contra lo capturado. */
  const vouOkX = plaVouClave === `${finLoc}|${planMonth}`;
  const realDe = d => {
    const manual = planN((v[d]||{}).tr);
    if(manual > 0) return manual;
    return (vouOkX && plaVou[d] != null) ? Number(plaVou[d]) : null;
  };
  {
    let mes=0; const row=['TARJETA BANCARIA REAL (VOUCHER TERMINAL)'];
    weeks.forEach(w=>{let wk=0;w.days.forEach(d=>{const val=realDe(d);row.push(val==null?null:val);wk+=val||0;mes+=val||0;});row.push(wk||null);});
    row.push(mes||null); rows.push(row);
    let mesD=0; const rowD=['DIFERENCIA (REAL − CORTE)'];
    weeks.forEach(w=>{let wk=0;w.days.forEach(d=>{
      const r0=realDe(d), c0=planN((v[d]||{}).tj);
      if(r0==null || !c0){ rowD.push(null); return; }
      const x=Math.round((r0-c0)*100)/100; rowD.push(x||null); wk+=x; mesD+=x;});
      rowD.push(wk||null);});
    rowD.push(mesD||null); rows.push(rowD);
  }
  addR('RAPPI','ra',v);
  const totRow=['VENTA TOTAL'];let vtM=0;
  weeks.forEach(w=>{let wk=0;w.days.forEach(d=>{const t=planN((v[d]||{}).ef)+planN((v[d]||{}).tj)+planN((v[d]||{}).ra);totRow.push(t||null);wk+=t;vtM+=t;});totRow.push(wk||null);});
  totRow.push(vtM||null);rows.push(totRow);rows.push([]);
  PLAN_GV.forEach(c=>{const gc=g[c]||{};let mes=0;const row=[c];
    weeks.forEach(w=>{let wk=0;w.days.forEach(d=>{const val=planN(gc[d]);row.push(val||null);wk+=val;mes+=val;});row.push(wk||null);});
    row.push(mes||null);rows.push(row);});
  rows.push([],['GASTOS FIJOS','MONTO','PAGADO']);
  PLAN_GF.forEach(c=>{const r=f[c]||{};rows.push([c,planN(r.monto)||null,r.pagado?'✓':'']);});
  const wb2=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb2,XLSX.utils.aoa_to_sheet(rows),mn.slice(0,31));
  XLSX.writeFile(wb2,`Planilla_${planMonth}_SC.xlsx`);
  toast('Excel descargado ✓');
}
